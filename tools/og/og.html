.share-brand .short-rule{margin:24px auto;width:48px}

.share-brand .script{font-size:48px;line-height:1.4;margin-top:16px}
.share-brand .contact{font-family:var(--serif);font-size:16px;letter-spacing:.02em;white-space:nowrap;margin-top:36px;line-height:1.9;color:var(--muted)}
